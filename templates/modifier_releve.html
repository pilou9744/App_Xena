<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ titre }} - GeckoCare Xena</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="entete">
        <h1>GeckoCare Xena</h1>
        <nav class="navigation" aria-label="Navigation principale">
            <a href="{{ url_for('accueil') }}">Accueil</a>
            <a href="{{ url_for('tableau_de_bord') }}">Tableau de bord</a>
            <a href="{{ url_for('releves') }}">Releves</a>
            <a href="{{ url_for('repas') }}">Repas</a>
            <a href="{{ url_for('observations') }}">Observations</a>
            <a href="{{ url_for('insectes') }}">Insectes</a>
            <a href="{{ url_for('boites_insectes') }}">Boites</a>
            <a href="{{ url_for('materiel') }}">Materiel</a>
            <a href="{{ url_for('plantes') }}">Plantes</a>
            <a href="{{ url_for('animaux') }}">Animaux</a>
            <a href="{{ url_for('reglages') }}">Reglages</a>
        </nav>
    </header>

    <main class="contenu">
        <section class="intro">
            <h2>Modifier un releve</h2>
            <p class="texte-secondaire">Correction d'un releve existant.</p>
        </section>

        <section class="carte section-dashboard">
            {% if erreur %}
                <p class="message-erreur">{{ erreur }}</p>
            {% endif %}

            <form class="formulaire formulaire-releve" method="post">
                <div class="champ champ-large">
                    <label for="animal_id">Animal</label>
                    <select id="animal_id" name="animal_id">
                        {% for animal in animaux %}
                            <option value="{{ animal.id }}" {% if releve.animal_id == animal.id %}selected{% endif %}>{{ animal.nom }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="groupe-releve">
                    <div class="champ">
                        <label for="date_releve">Date</label>
                        <input id="date_releve" name="date_releve" type="date" value="{{ releve.date_releve }}" required>
                    </div>

                    <div class="champ">
                        <label for="heure_releve">Heure</label>
                        <input id="heure_releve" name="heure_releve" type="time" value="{{ releve.heure_releve or '' }}" required>
                    </div>
                </div>

                <div class="groupe-releve">
                    <div class="champ">
                        <label for="temperature">Temperature (C)</label>
                        <input id="temperature" name="temperature" type="number" step="0.1" value="{{ releve.temperature }}" required>
                    </div>

                    <div class="champ">
                        <label for="humidite">Humidite (%)</label>
                        <input id="humidite" name="humidite" type="number" min="0" max="100" value="{{ releve.humidite }}" required>
                    </div>
                </div>

                <div class="groupe-releve groupe-releve-actions">
                    <label class="case">
                        <input name="brumisation" type="checkbox" {% if releve.brumisation %}checked{% endif %}>
                        Brumisation faite
                    </label>

                    <label class="case">
                        <input name="eau_changee" type="checkbox" {% if releve.eau_changee %}checked{% endif %}>
                        Eau changee
                    </label>
                </div>

                <div class="champ champ-large">
                    <label for="moment">Ce relevé décrit</label>
                    <select id="moment" name="moment" required>
                        <option value="matin" {% if releve.moment == "matin" %}selected{% endif %}>La nuit écoulée</option>
                        <option value="soir" {% if releve.moment == "soir" %}selected{% endif %}>La journée écoulée</option>
                    </select>
                </div>

                <div class="champ champ-large">
                    <label for="notes">Notes</label>
                    <textarea id="notes" name="notes" rows="3">{{ releve.notes or "" }}</textarea>
                </div>

                <div class="actions-formulaire">
                    <button type="submit">Enregistrer</button>
                    <a class="bouton-secondaire" href="{{ url_for('releves') }}">Annuler</a>
                </div>
            </form>
        </section>
    </main>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
